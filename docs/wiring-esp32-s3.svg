<text x="274" y="922" class="lbl">mot (WS / LRC)</text>
<line class="w data" x1="230" y1="940" x2="266" y2="940"/>
<text x="274" y="944" class="lbl">données audio (SD / DIN)</text>
<line class="w yel" x1="44" y1="962" x2="80" y2="962"/>
<line class="w brn" x1="80" y1="962" x2="116" y2="962"/>
<line class="w cyan" x1="116" y1="962" x2="152" y2="962"/>
<text x="160" y="966" class="lbl">fils du R503 : jaune, marron, bleu</text>
<circle cx="52" cy="984" r="4" fill="#333333"/>
<text x="64" y="988" class="lbl" style="font-size:11px">connexion électrique — deux fils qui se croisent sans point ne sont pas reliés.</text>
<text x="580" y="876" class="warn">Masse commune obligatoire entre tous les modules.</text>
<text x="580" y="898" class="lbl">Câblez hors tension (USB débranché).</text>
<text x="580" y="916" class="lbl">INMP441 et R503 en 3,3 V : le 5 V les détruit.</text>
<text x="580" y="934" class="lbl">UNE seule broche 3V3, GND et 5V sur la carte :</text>
<text x="580" y="952" class="lbl">tout part sur les rails d'une plaque d'essai.</text>
<text x="580" y="970" class="lbl">Rien sur GPIO 0, 3, 45, 46 (démarrage), 19, 20 (USB).</text>
<text x="580" y="988" class="lbl">Fils I2S de 15 cm max, loin des fils du haut-parleur.</text>
<text x="580" y="1006" class="lbl">Alimentation 5 V / 2 A. Détails : docs/BROCHAGE.md §1.5</text>
