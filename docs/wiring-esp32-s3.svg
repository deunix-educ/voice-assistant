<text x="1020" y="876" class="title" style="font-size:13px">Découplage conseillé</text>
<text x="1020" y="900" class="lbl">C1 = 470 µF / 16 V électrolytique, faible ESR</text>
<text x="1020" y="920" class="lbl">      polarisé : la bande imprimée est le « − »</text>
<text x="1020" y="940" class="lbl">C2 = 100 nF X7R céramique (code 104)</text>
<text x="1020" y="960" class="lbl">les deux à moins de 3 cm des broches de l'ampli</text>
<rect x="30" y="852" width="520" height="140" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5"/>
