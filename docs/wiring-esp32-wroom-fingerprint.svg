<text x="88" y="922" class="lbl">3,3 V</text>
<line class="w gnd" x1="44" y1="940" x2="80" y2="940"/>
<text x="88" y="944" class="lbl">masse / logique</text>
<line class="w clk" x1="230" y1="896" x2="266" y2="896"/>
<text x="274" y="900" class="lbl">horloge bit (SCK / BCLK)</text>
<line class="w ws" x1="230" y1="918" x2="266" y2="918"/>
<text x="274" y="922" class="lbl">mot (WS / LRC)</text>
<line class="w data" x1="230" y1="940" x2="266" y2="940"/>
<text x="274" y="944" class="lbl">données audio (SD / DIN)</text>
<line class="w yel" x1="44" y1="962" x2="80" y2="962"/><line class="w brn" x1="80" y1="962" x2="116" y2="962"/><line class="w cyan" x1="116" y1="962" x2="152" y2="962"/>
<text x="160" y="966" class="lbl">fils du R503 : jaune, marron, bleu</text>
<circle cx="52" cy="984" r="4" fill="#333333"/>
<text x="64" y="988" class="lbl" style="font-size:11px">connexion électrique — deux fils qui se croisent sans point ne sont pas reliés.</text>
<text x="580" y="876" class="warn">Masse commune obligatoire entre tous les modules.</text>
<text x="580" y="898" class="lbl">Câblez hors tension (USB débranché).</text>
<text x="580" y="916" class="lbl">INMP441 et R503 en 3,3 V : le 5 V les détruit.</text>
<text x="580" y="934" class="lbl">TX et RX sont croisés : le TX du capteur va sur GPIO 16 (RX2).</text>
<text x="580" y="952" class="lbl">GPIO 34 : entrée seule, sans résistance interne.</text>
<text x="580" y="970" class="lbl">Éviter GPIO 0, 12, 15 (démarrage), 6 à 11 (flash), 1 et 3 (USB-série).</text>
<text x="580" y="988" class="lbl">Fils I2S de 15 cm max, loin des fils du haut-parleur.</text>
<text x="580" y="1006" class="lbl">Alimentation 5 V / 2 A. Détails : docs/BROCHAGE.md §1.3b et §1.6</text>
</svg>
