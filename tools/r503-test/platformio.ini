; Banc d'essai du capteur R503 seul (ESP32 WROOM) : projet PlatformIO indépendant du firmware de l'assistant.
; Il ne partage aucun code avec lui, pour qu'une panne du firmware principal ne puisse pas fausser le diagnostic.
; Voir docs/BROCHAGE.md §1.8. Pour revenir au firmware normal : make fw-upload.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Même fork « pioarduino » que le firmware principal : le core est déjà en cache.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall
