; Configuration PlatformIO du firmware de l'assistant vocal.
;
; Nous utilisons le core Arduino-ESP32 3.x (basé sur ESP-IDF 5.x) car il fournit
; le nouveau pilote I2S « i2s_std », le seul maintenu. Le paquet officiel
; « espressif32 » du registre PlatformIO est resté sur le core 2.0.x : on passe
; donc par le fork communautaire « pioarduino », maintenu et recommandé par
; Espressif pour les cores 3.x.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32dev
framework = arduino

; Le débit série doit dépasser le débit audio (32 kB/s) : voir README.
monitor_speed = 921600
upload_speed = 921600

; Table de partitions : 3 Mo pour le programme au lieu de 1,3 Mo, sans zone de
; mise à jour à distance (OTA), inutile ici. Avec le Wi-Fi, le programme occupait
; déjà 74 % de la partition par défaut à l'étape 3.
board_build.partitions = huge_app.csv

; Client MQTT minimal et éprouvé (étape 3). Version épinglée : pas de surprise.
lib_deps =
    knolleary/PubSubClient @ 2.8
    ; Lecture des messages JSON du topic control (étape 5), commandes à venir (étape 11).
    bblanchon/ArduinoJson @ 7.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; Le firmware est découpé en classes : include/ pour les constantes, src/ pour le code.
build_src_filter = +<*>

check_tool = cppcheck
check_flags = --enable=warning,style
