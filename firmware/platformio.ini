; Configuration PlatformIO du firmware de l'assistant vocal.
;
; Nous utilisons le core Arduino-ESP32 3.x (basé sur ESP-IDF 5.x) car il fournit
; le nouveau pilote I2S « i2s_std », le seul maintenu. Le paquet officiel
; « espressif32 » du registre PlatformIO est resté sur le core 2.0.x : on passe
; donc par le fork communautaire « pioarduino », maintenu et recommandé par
; Espressif pour les cores 3.x.
;
; Deux cartes (branche fingerprint, étape F5), un environnement chacune. Sans « -e »,
; PlatformIO les compilerait toutes : default_envs garde la WROOM par défaut, et le
; Makefile choisit l'autre avec FW_ENV (make fw-upload FW_ENV=esp32s3mini).

[platformio]
default_envs = esp32dev

; Réglages communs aux deux cartes.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino

; Client MQTT minimal et éprouvé (étape 3). Version épinglée : pas de surprise.
lib_deps =
    knolleary/PubSubClient @ 2.8
    ; Lecture des messages JSON du topic control (étape 5), commandes à venir (étape 11).
    bblanchon/ArduinoJson @ 7.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -Wall

; Le firmware est découpé en classes : include/ pour les constantes, src/ pour le code.
build_src_filter = +<*>

check_tool = cppcheck
check_flags = --enable=warning,style

; ESP32 WROOM (DevKit V1) : pont USB-série CP210x/CH340, brochage de pins_esp32_wroom.h.
[env:esp32dev]
board = esp32dev

; Le débit série doit dépasser le débit audio (32 kB/s) : voir README.
monitor_speed = 921600
upload_speed = 921600

; Table de partitions : 3 Mo pour le programme au lieu de 1,3 Mo, sans zone de
; mise à jour à distance (OTA), inutile ici. Avec le Wi-Fi, le programme occupait
; déjà 74 % de la partition par défaut à l'étape 3.
board_build.partitions = huge_app.csv

; ESP32-S3 Mini (18 broches, USB-C, flash 4 Mo) : brochage de pins_esp32_s3_mini.h.
; Pas de puce USB-série : le moniteur passe par l'USB natif de la puce (USB-Serial/JTAG),
; le port s'appelle /dev/ttyACM0 et son « débit » n'a pas de sens.
[env:esp32s3mini]
board = esp32-s3-devkitc-1
upload_speed = 921600
monitor_speed = 921600

; La carte « devkitc-1 » suppose 8 Mo de flash : celle-ci en a 4. Mémoire flash en mode QIO ;
; la PSRAM éventuelle du module n'est pas utilisée (pas de BOARD_HAS_PSRAM).
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv

build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3_MINI
    ; Serial = USB-Serial/JTAG de la puce, dès le démarrage.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
