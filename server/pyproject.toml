[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-server"
version = "0.1.0"
description = "Serveur d'assistant vocal local (MQTT, faster-whisper, Piper)"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dépendances épinglées : indispensables dès l'étape 1 (outils série) et l'étape 3 (MQTT).
dependencies = [
    "pyserial==3.5",
    "paho-mqtt==2.1.0",
    "numpy==2.5.3",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
    "soxr==0.5.0.post1",
]

[project.optional-dependencies]
# Installées à l'étape 6 (transcription et synthèse vocale). Pas de VAD à part : Whisper reçoit la session entière.
# Versions minimales pour Python 3.13 : faster-whisper 1.0 exige av<13 (compilé
# depuis les sources, sans roue 3.13) et piper-tts 1.2 dépend de piper-phonemize,
# sans roue au-delà de Python 3.11. piper-tts 1.3+ embarque espeak-ng.
speech = [
    "faster-whisper==1.2.1",
    "piper-tts==1.8.0",
]
dev = [
    "pyright==1.1.389",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_server*"]

[tool.pytest.ini_options]
# Les tests importent voice_server depuis server/, sans installation préalable.
pythonpath = ["."]
testpaths = ["tests"]
