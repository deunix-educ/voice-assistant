# Configuration du serveur vocal.
# Les valeurs sensibles (mots de passe, jetons) vont dans .env, jamais ici.
# Les sections marquées « étape N » ne sont lues qu'à partir de cette étape.
# Branche fingerprint : pas de VAD, de diarisation, de voix ni de mot de réveil (étapes F3 à F4b).

audio:
    sample_rate: 16000          # Hz, identique dans tout le système
    bits: 16
    channels: 1
    codec: pcm_s16le
    chunk_ms: 50                # 800 échantillons = 1600 octets

# étape 4 : broker MQTT. Le serveur écoute TOUTES les cartes : voice/+/...
mqtt:
    host: 10.42.0.1         # broker du Raspberry Pi 5 (comptes exigés : server/.env) ; relu par le Makefile
    port: 1883
    keepalive: 30
    client_id: voice-server     # unique sur le broker
    topic_prefix: voice

# étape 4 : sessions de parole reçues des ESP32
sessions:
    max_seconds: 30             # au-delà, on arrête d'accumuler (garde-fou mémoire)
    idle_timeout_s: 5           # plus rien reçu depuis 5 s et pas de END : on clôt
    end_grace_s: 0.5            # après le END, attente des derniers chunks en vol

# chemins relatifs à ce fichier
storage:
    recordings_dir: recordings
    models_dir: models

logging:
    level: INFO
    format: "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
    # étape 15 : copie du journal dans un fichier tournant (3 x 1 Mo), pour
    # retrouver ce qui s'est passé sur un Raspberry Pi sans écran. Vide : écran seul.
    file: logs/voice-server.log

# étape 6 : transcription (modèle dans models/whisper/<model>, « make models »)
stt:
    model: small                # « base » sur Raspberry Pi 4, « small » sur Pi 5 / PC
    language: fr
    compute_type: int8
    beam_size: 5                # 1 = plus rapide, 5 = plus précis
    no_speech_threshold: 0.6    # segment écarté au-delà : Whisper invente du texte sur le silence
    # étape 16 : fils de calcul de Whisper ; 0 = défaut de la bibliothèque (4). Mesuré sur un PC
    # à 20 cœurs logiques : 4 → 1,08 s, 8 → 0,98 s, 16 → 1,29 s (pire). Sur un Pi 5 : laisser 0.
    cpu_threads: 0
    # F4 (sans VAD) : une session dont le niveau efficace est plus faible que cela est un silence,
    # Whisper n'est pas appelé. Mesuré sur 180 sessions : bruit de fond -63 dBFS, parole la plus
    # faible -51 dBFS. Un clic du bouton (jusqu'à -16 dBFS) n'est PAS filtré : Whisper l'écarte seul.
    min_rms_dbfs: -58

# étape 6 : synthèse vocale (modèle dans models/piper/<voice>.onnx, « make models »)
# Piper produit du 22 050 Hz : le serveur rééchantillonne en audio.sample_rate.
tts:
    voice: fr_FR-siwis-medium
    length_scale: 1.0           # > 1 : débit plus lent

# étape 11 : domotique. Commandes publiées sur <topic_prefix>/<pièce>/<appareil>/set ;
# la carte exécute en plus celles de sa propre pièce (LED de démonstration).
home:
    topic_prefix: home
    rooms:                      # nom tel qu'on le dit → complément dans les réponses
        salon: du salon
        cuisine: de la cuisine
        chambre: de la chambre
        salle de bain: de la salle de bain
        bureau: du bureau
        garage: du garage
        entrée: de l'entrée
    boards:                     # pièce de chaque carte : « allume la lumière » sans pièce = ici
        esp32-01: salon

# étape 14 : droits par personne. Depuis F4, la personne est celle dont le DOIGT a ouvert la session
# (section fingerprint, plus bas) ; la voix n'identifie plus personne. Niveaux : complet > standard > limite.
# Les noms se comparent sans tenir compte de la casse ni des accents (« denis » = « Denis »).
access:
    unknown: limite             # bouton PTT, ou doigt sans nom dans fingerprint.users : conversation seulement
    default: standard           # personne nommée par un doigt, absente de users
    users:                      # nom de la personne → niveau ; le nom est celui de fingerprint.users
        Denis: complet
    rules:                      # niveau minimal par appareil et action ; absent = complet
        light: {"on": standard, "off": standard}   # guillemets : on/off nus = booléens en YAML
        shutter: {open: standard, close: standard}
        door: {open: complet, close: standard}
        machine: {wake: standard, lock: standard, shutdown: complet, reboot: complet}   # étape 15b
    # « Confirmez-vous ? » puis « oui », dit avec le MÊME DOIGT que la demande : un autre doigt de la
    # même personne, le doigt d'une autre personne ou le bouton PTT annulent la demande.
    confirm: [door.open, machine.shutdown, machine.reboot]
    confirm_timeout_s: 15

# étape 15b : machines Linux du réseau. Chacune fait tourner un agent (agent/voice_agent.py)
# qui n'exécute QUE les actions de SA liste (/etc/voice-assistant/agent.yaml) ; ici, on dit
# seulement comment on les appelle. « allume » = Wake-on-LAN, envoyé par le serveur
# (la machine éteinte n'a pas d'agent). Nouvelle action : l'ajouter à l'agent, ici
# (mots et phrases), puis dans access.rules.machine (sinon : niveau complet exigé).
machines:
    topic_prefix: agent         # agent/<machine>/state (retenu), command, result
    broadcast: 255.255.255.255  # Wake-on-LAN : diffusion sur le réseau local
    actions:                    # mots sans accents ; « does » et « verb » : phrases dites
        # Un mot par entrée, tel que Whisper l'écrit : « lock » devient souvent « Locke »,
        # « shutdown » devient « Shut down » (d'où « shut »).
        wake: {words: [allume, allumer, allumez, demarre, demarrer, reveille, reveiller], does: "J'allume", verb: allumer}
        shutdown: {words: [eteins, eteint, eteindre, eteignez, arrete, arreter, arretez, shutdown, shut], does: "J'éteins", verb: éteindre}
        reboot: {words: [redemarre, redemarrer, redemarrez, relance, relancer, reboot, reboote, rebooter], does: "Je redémarre", verb: redémarrer}
        lock: {words: [verrouille, verrouiller, verrouillez, lock, locke, locker, loque], does: "Je verrouille", verb: verrouiller}
    list:                       # identifiant de l'agent → comment on l'appelle
        pc-bureau:
            # Plusieurs mots : « bureau » seul est une pièce. « p c » : Whisper écrit parfois « P.C. ».
            names: [pc du bureau, p c du bureau, ordinateur du bureau]
            name: le PC du bureau
            mac: ""             # ex. "aa:bb:cc:dd:ee:ff" (ip link) pour « allume le PC du bureau »

# branche fingerprint, étape F2 : capteur d'empreinte R503. Chaque doigt enregistré dans le capteur
# a un numéro (emplacement) ; ici, à qui il appartient. Une même personne peut avoir plusieurs doigts.
# Les droits de chaque personne restent dans access.users, par nom.
# Enregistrer un doigt : make finger-enroll NAME=Denis ; il affiche la ligne à ajouter ci-dessous.
fingerprint:
    users: { 1: Denis }                   # ex. : {1: Denis, 2: Denis, 3: Jessica}
